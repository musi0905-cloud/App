<script>
(function () {
  'use strict';

  // 화면이 아예 비어 보이는 문제를 진단하기 위한 안전장치. 초기화 중 어디서든 JS 오류가 나면
  // 화면이 그냥 하얗게 비는 대신 오류 문구를 실제로 화면에 찍는다 (콘솔에 접근할 수 없는
  // 모바일 브라우저에서도 캡처 한 장으로 원인을 바로 알 수 있게 하려는 목적).
  function showFatalError_(context, err) {
    try {
      const message = (err && (err.stack || err.message)) || String(err);
      const box = document.createElement('div');
      box.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#fff;color:#c62828;' +
        'padding:16px;font-family:monospace;font-size:13px;white-space:pre-wrap;overflow:auto;';
      box.textContent = '화면을 그리는 중 오류가 발생했습니다.\n\n[' + context + ']\n' + message;
      document.body.appendChild(box);
    } catch (e2) {
      // 오류 표시 자체가 실패하면 더 손쓸 방법이 없다.
    }
  }

  window.addEventListener('error', function (e) {
    showFatalError_('전역 오류', e.error || e.message);
  });
  window.addEventListener('unhandledrejection', function (e) {
    showFatalError_('처리되지 않은 Promise 오류', e.reason);
  });

  // ============================================================
  // 공통 유틸
  // ============================================================

  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // 외부 라이브러리 없이 구현하는 안전한 미니 마크다운 변환.
  // 항상 escapeHtml을 먼저 적용한 뒤 정해진 패턴만 태그로 바꾸므로
  // 사용자가 입력한 <script> 등은 그대로 문자열로만 표시된다.
  function formatResultText(raw) {
    const text = String(raw == null ? '' : raw);
    if (!text.trim()) return '';

    const escaped = escapeHtml(text);
    const lines = escaped.split(/\r?\n/);

    let html = '';
    let listType = null;
    let paragraph = [];

    function inline(s) {
      return s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    }
    function flushParagraph() {
      if (paragraph.length) {
        html += '<p>' + paragraph.join('<br>') + '</p>';
        paragraph = [];
      }
    }
    function closeList() {
      if (listType) {
        html += '</' + listType + '>';
        listType = null;
      }
    }

    lines.forEach(function (line) {
      const trimmed = line.trim();

      if (!trimmed) {
        flushParagraph();
        closeList();
        return;
      }

      const headingMatch = trimmed.match(/^(#{1,3})\s+(.*)$/);
      if (headingMatch) {
        flushParagraph();
        closeList();
        html += '<h3>' + inline(headingMatch[2]) + '</h3>';
        return;
      }

      const bulletMatch = trimmed.match(/^[-•]\s+(.*)$/);
      if (bulletMatch) {
        flushParagraph();
        if (listType !== 'ul') { closeList(); html += '<ul>'; listType = 'ul'; }
        html += '<li>' + inline(bulletMatch[1]) + '</li>';
        return;
      }

      const numberedMatch = trimmed.match(/^\d+[.)]\s+(.*)$/);
      if (numberedMatch) {
        flushParagraph();
        if (listType !== 'ol') { closeList(); html += '<ol>'; listType = 'ol'; }
        html += '<li>' + inline(numberedMatch[1]) + '</li>';
        return;
      }

      closeList();
      paragraph.push(inline(trimmed));
    });

    flushParagraph();
    closeList();
    return html;
  }

  function callServer(fnName) {
    const args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve) {
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        resolve({ success: false, message: '서버에 연결할 수 없습니다.' });
        return;
      }
      google.script.run
        .withSuccessHandler(function (result) { resolve(result); })
        .withFailureHandler(function (error) {
          resolve({ success: false, message: (error && error.message) || '서버 요청 중 오류가 발생했습니다.' });
        })[fnName].apply(null, args);
    });
  }

  function toast(message, isError) {
    const container = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = 'toast' + (isError ? ' toast-error' : '');
    el.textContent = message;
    container.appendChild(el);
    setTimeout(function () {
      el.remove();
    }, 2600);
  }

  function debounce(fn, delay) {
    let timer = null;
    return function () {
      const args = arguments;
      clearTimeout(timer);
      timer = setTimeout(function () { fn.apply(null, args); }, delay);
    };
  }

  function setLoading(container, count) {
    let html = '';
    for (let i = 0; i < (count || 3); i++) {
      html += '<div class="skeleton skeleton-card"></div>';
    }
    container.innerHTML = html;
  }

  function setEmpty(container, title, desc) {
    container.innerHTML =
      '<div class="state-box">' +
      '<div class="state-title">' + escapeHtml(title) + '</div>' +
      (desc ? '<div class="state-desc">' + escapeHtml(desc) + '</div>' : '') +
      '</div>';
  }

  function setErrorState(container, title, onRetry) {
    const retryId = 'retry-' + Math.random().toString(36).slice(2);
    container.innerHTML =
      '<div class="state-box">' +
      '<div class="state-title">' + escapeHtml(title) + '</div>' +
      '<button id="' + retryId + '" class="btn btn-outline">다시 시도</button>' +
      '</div>';
    const btn = document.getElementById(retryId);
    if (btn) btn.addEventListener('click', onRetry);
  }

  // ============================================================
  // 상태/유형 표시 헬퍼 (서버가 이미 한글 문자열을 보내주므로 매핑만 담당)
  // ============================================================

  const STATUS_TONE = {
    '승인 대기': 'st-pending',
    '승인 완료': 'st-approved',
    '완료': 'st-approved',
    '오류': 'st-error',
    '처리 중': 'st-processing',
    '실행 대기': 'st-neutral',
    '수정 요청': 'st-neutral',
    '폐기': 'st-neutral',
    '보류': 'st-neutral'
  };
  const STATUS_ICON = {
    '승인 대기': '⏳',
    '승인 완료': '✅',
    '완료': '✅',
    '오류': '⚠️',
    '처리 중': '🔄',
    '실행 대기': '🕓',
    '수정 요청': '✏️',
    '폐기': '🗑️',
    '보류': '⏸️'
  };

  function statusBadgeHtml(status) {
    const tone = STATUS_TONE[status] || 'st-neutral';
    const icon = STATUS_ICON[status] || '';
    return '<span class="status-badge ' + tone + '">' + icon + ' ' + escapeHtml(status) + '</span>';
  }

  function assignedModelLabel(assignedModel) {
    const map = { 'GPT': 'GPT', '클로드': 'Claude', '없음': '없음' };
    return map[assignedModel] || assignedModel || '없음';
  }

  function roleBadgeText(commandType, assignedModel) {
    // AI 협의는 GPT/Claude가 함께 5단계로 협의한 결과이므로 단일 모델 이름을 앞에 붙이지 않는다.
    if (commandType === 'AI 협의') return 'AI 협의 (GPT + Claude)';
    const m = { 'GPT': 'GPT', '클로드': 'Claude', '없음': '' }[assignedModel];
    const label = m === undefined ? assignedModel : m;
    return label ? (label + ' ' + commandType) : commandType;
  }

  // ============================================================
  // 앱 상태 / 라우팅
  // ============================================================

  const state = {
    view: 'home',
    detailId: null,
    detailOrigin: 'home',
    pipelineDetailId: null,
    history: { status: '', type: '', model: '', search: '' }
  };

  function navTo(view) {
    state.view = view;
    document.querySelectorAll('.view').forEach(function (el) { el.classList.remove('active'); });
    document.getElementById('view-' + view).classList.add('active');

    document.querySelectorAll('.bottomnav-item, .sidenav-item').forEach(function (el) {
      el.classList.toggle('active', el.getAttribute('data-view') === view);
    });

    if (view !== 'detail') {
      document.getElementById('detail-actionbar').classList.add('hidden');
      document.getElementById('detail-actionbar').innerHTML = '';
    }
    if (view !== 'pipeline-detail') {
      document.getElementById('pipeline-detail-actionbar').classList.add('hidden');
      document.getElementById('pipeline-detail-actionbar').innerHTML = '';
    }
    if (view !== 'blog-detail') {
      document.getElementById('blog-detail-actionbar').classList.add('hidden');
      document.getElementById('blog-detail-actionbar').innerHTML = '';
    }

    if (view === 'home') loadHome();
    else if (view === 'history') loadHistory();
    else if (view === 'settings') loadSettings();
    else if (view === 'pipeline') loadPipelineDashboard();
    else if (view === 'blog') loadBlogView();

    window.scrollTo(0, 0);
  }

  function openPipelineDetail(projectId) {
    state.pipelineDetailId = projectId;
    state.view = 'pipeline-detail';
    document.querySelectorAll('.view').forEach(function (el) { el.classList.remove('active'); });
    document.getElementById('view-pipeline-detail').classList.add('active');
    document.querySelectorAll('.bottomnav-item, .sidenav-item').forEach(function (el) { el.classList.remove('active'); });
    document.getElementById('detail-actionbar').classList.add('hidden');
    document.getElementById('blog-detail-actionbar').classList.add('hidden');
    loadPipelineDetail(projectId);
    window.scrollTo(0, 0);
  }

  function openDetail(commandId, origin) {
    state.detailId = commandId;
    state.detailOrigin = origin || 'home';
    state.view = 'detail';
    document.querySelectorAll('.view').forEach(function (el) { el.classList.remove('active'); });
    document.getElementById('view-detail').classList.add('active');
    document.querySelectorAll('.bottomnav-item, .sidenav-item').forEach(function (el) { el.classList.remove('active'); });
    document.getElementById('pipeline-detail-actionbar').classList.add('hidden');
    document.getElementById('blog-detail-actionbar').classList.add('hidden');
    loadDetail(commandId);
    window.scrollTo(0, 0);
  }

  // ============================================================
  // 홈
  // ============================================================

  function summaryCardHtml(label, value, tone) {
    return '<div class="summary-card ' + (tone ? 'tone-' + tone : '') + '">' +
      '<div class="summary-label">' + escapeHtml(label) + '</div>' +
      '<div class="summary-value">' + value + '건</div>' +
      '</div>';
  }

  function pendingCardHtml(card) {
    return (
      '<div class="card" data-command-id="' + escapeHtml(card.commandId) + '">' +
      '<div class="card-top">' +
      '<span class="role-badge">' + escapeHtml(roleBadgeText(card.commandType, card.assignedModel)) + '</span>' +
      statusBadgeHtml(card.status) +
      '</div>' +
      '<div class="card-id">' + escapeHtml(card.commandId) + ' · ' + escapeHtml(card.createdAt) + '</div>' +
      '<div class="card-request">' + escapeHtml(card.requestPreview) + '</div>' +
      '<div class="card-result">' + escapeHtml(card.resultPreview || '결과 없음') + '</div>' +
      '<div class="card-actions">' +
      '<button class="btn btn-outline btn-sm act-view" data-command-id="' + escapeHtml(card.commandId) + '">전체 내용 보기</button>' +
      '<button class="btn btn-primary btn-sm act-approve" data-command-id="' + escapeHtml(card.commandId) + '">승인</button>' +
      '<button class="btn btn-outline btn-sm act-revise-toggle" data-command-id="' + escapeHtml(card.commandId) + '">수정 요청</button>' +
      '<button class="btn btn-danger btn-sm act-reject" data-command-id="' + escapeHtml(card.commandId) + '">폐기</button>' +
      '</div>' +
      '<div class="card-revise-box hidden" data-revise-box="' + escapeHtml(card.commandId) + '">' +
      '<div class="revise-panel">' +
      '<textarea class="input textarea" rows="3" placeholder="수정의견을 입력하세요."></textarea>' +
      '<button class="btn btn-primary btn-block act-revise-submit" data-command-id="' + escapeHtml(card.commandId) + '">수정 요청 보내기</button>' +
      '</div>' +
      '</div>' +
      '</div>'
    );
  }

  function loadHome() {
    const summaryEl = document.getElementById('home-summary');
    const pendingEl = document.getElementById('home-pending');
    setLoading(summaryEl, 1);
    setLoading(pendingEl, 3);

    callServer('webGetDashboard').then(function (res) {
      if (!res || !res.success) {
        setErrorState(summaryEl, '데이터를 불러오지 못했습니다.', function () { loadHome(); });
        pendingEl.innerHTML = '';
        return;
      }
      const s = res.data.summary;
      summaryEl.innerHTML =
        summaryCardHtml('승인 대기', s.awaitingApproval, 'pending') +
        summaryCardHtml('실행 대기', s.ready, '') +
        summaryCardHtml('처리 중', s.processing, 'processing') +
        summaryCardHtml('오류', s.error, 'error');

      const pending = res.data.pendingApprovals || [];
      if (!pending.length) {
        setEmpty(pendingEl, '승인 대기 중인 작업이 없습니다', '새 작업이 처리되면 여기에 표시됩니다.');
        return;
      }
      pendingEl.innerHTML = pending.map(pendingCardHtml).join('');
    });
  }

  // ============================================================
  // 승인 / 수정 / 폐기 공용 처리
  // ============================================================

  // submitApproval()은 이제 승인/수정 시 서버에서 다음 단계까지 자동 생성 + 즉시 실행까지 마친 뒤
  // { success, message, currentCommand, nextCommand } 형태로 결과를 돌려준다.
  // 버튼은 이 요청 하나가 끝날 때까지(체인 전체가 끝날 때까지) 계속 잠겨 있는다.
  function runApprovalAction(commandId, decisionKey, note, triggerBtn) {
    const originalText = triggerBtn ? triggerBtn.textContent : '';
    const busyText = { approve: '승인 처리 중...', revise: '수정 요청 처리 중...', reject: '폐기 처리 중...' };
    if (triggerBtn) {
      triggerBtn.disabled = true;
      triggerBtn.textContent = busyText[decisionKey] || '처리 중...';
    }
    return callServer('webApproveAndContinue', commandId, decisionKey, note || '').then(function (res) {
      if (triggerBtn) {
        triggerBtn.disabled = false;
        triggerBtn.textContent = originalText;
      }
      if (!res || !res.success) {
        toast((res && res.message) || '처리 중 오류가 발생했습니다.', true);
        return null;
      }
      toast(res.message || '처리되었습니다.');
      return res;
    });
  }

  // 승인/수정으로 새 후속 작업이 즉시 생성·실행됐다면 그 작업 상세로 이동하고,
  // 아니면(폐기이거나 후속 작업이 없으면) 현재 보고 있던 화면만 새로고침한다.
  function handleApprovalOutcome(commandId, res) {
    if (res.nextCommand) {
      const origin = state.view === 'detail' ? state.detailOrigin : state.view;
      openDetail(res.nextCommand.commandId, origin);
      return;
    }
    if (state.view === 'detail' && state.detailId === commandId) loadDetail(commandId);
    else if (state.view === 'home') loadHome();
    else if (state.view === 'history') loadHistory();
  }

  document.addEventListener('click', function (e) {
    const viewBtn = e.target.closest('.act-view');
    if (viewBtn) {
      openDetail(viewBtn.getAttribute('data-command-id'), state.view);
      return;
    }

    const approveBtn = e.target.closest('.act-approve');
    if (approveBtn) {
      const id = approveBtn.getAttribute('data-command-id');
      runApprovalAction(id, 'approve', '', approveBtn).then(function (res) {
        if (res) handleApprovalOutcome(id, res);
      });
      return;
    }

    const rejectBtn = e.target.closest('.act-reject');
    if (rejectBtn) {
      const id = rejectBtn.getAttribute('data-command-id');
      runApprovalAction(id, 'reject', '', rejectBtn).then(function (res) {
        if (res) handleApprovalOutcome(id, res);
      });
      return;
    }

    const reviseToggle = e.target.closest('.act-revise-toggle');
    if (reviseToggle) {
      const id = reviseToggle.getAttribute('data-command-id');
      const box = document.querySelector('[data-revise-box="' + CSS.escape(id) + '"]');
      if (box) box.classList.toggle('hidden');
      return;
    }

    const reviseSubmit = e.target.closest('.act-revise-submit');
    if (reviseSubmit) {
      const id = reviseSubmit.getAttribute('data-command-id');
      const box = document.querySelector('[data-revise-box="' + CSS.escape(id) + '"]');
      const textarea = box ? box.querySelector('textarea') : null;
      const note = textarea ? textarea.value.trim() : '';
      if (!note) { toast('수정의견을 입력해주세요.', true); return; }
      runApprovalAction(id, 'revise', note, reviseSubmit).then(function (res) {
        if (res) handleApprovalOutcome(id, res);
      });
      return;
    }

    const historyCard = e.target.closest('.history-card');
    if (historyCard) {
      openDetail(historyCard.getAttribute('data-command-id'), 'history');
      return;
    }

    const retryBtn = e.target.closest('.act-retry');
    if (retryBtn) {
      const id = retryBtn.getAttribute('data-command-id');
      retryBtn.disabled = true;
      retryBtn.textContent = '재실행 중...';
      callServer('webRetryCommand', id).then(function (res) {
        if (!res || !res.success) {
          toast((res && res.message) || '재실행 중 오류가 발생했습니다.', true);
          retryBtn.disabled = false;
          retryBtn.textContent = '다시 실행';
          return;
        }
        toast('작업을 다시 실행했습니다.');
        loadDetail(id);
      });
      return;
    }

    const runNowBtn = e.target.closest('.act-run-now');
    if (runNowBtn) {
      const id = runNowBtn.getAttribute('data-command-id');
      runNowBtn.disabled = true;
      runNowBtn.textContent = '실행 중...';
      callServer('runCommandNow', id).then(function (res) {
        if (!res || !res.success) {
          toast((res && res.message) || '작업 실행 중 오류가 발생했습니다.', true);
          runNowBtn.disabled = false;
          runNowBtn.textContent = '지금 실행';
          return;
        }
        toast('작업을 실행했습니다.');
        loadDetail(id);
      });
      return;
    }

    const discussionToggle = e.target.closest('.act-discussion-log-toggle');
    if (discussionToggle) {
      const id = discussionToggle.getAttribute('data-command-id');
      const box = document.querySelector('[data-discussion-log="' + CSS.escape(id) + '"]');
      if (!box) return;

      if (!box.classList.contains('hidden')) {
        box.classList.add('hidden');
        return;
      }

      box.classList.remove('hidden');
      if (box.dataset.loaded === 'true') return;

      setLoading(box, 2);
      callServer('getDiscussionLog', id).then(function (res) {
        if (!res || !res.success) {
          setErrorState(box, '협의 기록을 불러오지 못했습니다.', function () {
            box.dataset.loaded = '';
            discussionToggle.click();
            discussionToggle.click();
          });
          return;
        }
        const steps = res.data || [];
        if (!steps.length) {
          setEmpty(box, '협의 기록이 없습니다', '');
        } else {
          box.innerHTML = steps.map(function (s) {
            return '<div class="discussion-step">' +
              '<div class="detail-section-title">' + escapeHtml(s.label) + '</div>' +
              '<div class="detail-body">' + (formatResultText(s.text) || '<p>내용 없음</p>') + '</div>' +
              '</div>';
          }).join('');
        }
        box.dataset.loaded = 'true';
      });
      return;
    }
  });

  // ============================================================
  // 새 작업
  // ============================================================

  // AI 5단계 협의는 GPT/Claude를 순서대로 5번 호출하므로 응답까지 1~2분 정도 걸릴 수 있다.
  // 그 동안 버튼을 계속 잠가 중복 클릭을 막고, 진행 중임을 명확히 알린다.
  function initNewCommandForm() {
    const form = document.getElementById('new-command-form');
    const submitBtn = document.getElementById('new-command-submit');
    const originalSubmitText = submitBtn.textContent;

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const topic = document.getElementById('field-topic').value.trim();
      const priority = document.getElementById('field-priority').value;
      const projectId = document.getElementById('field-project').value.trim();

      if (!topic) { toast('주제를 입력해주세요.', true); return; }

      submitBtn.disabled = true;
      submitBtn.textContent = 'AI 협의 진행 중... (1~2분 소요)';

      callServer('webStartDiscussion', { topic: topic, priority: priority, projectId: projectId })
        .then(function (res) {
          submitBtn.disabled = false;
          submitBtn.textContent = originalSubmitText;

          if (!res || !res.success) {
            toast((res && res.message) || 'AI 협의 시작 중 오류가 발생했습니다.', true);
            return;
          }

          toast('AI 협의가 끝났습니다. 최종보고서를 확인해주세요.');
          form.reset();
          document.getElementById('field-priority').value = '보통';

          openDetail(res.data.commandId, 'new');
        });
    });
  }

  // ============================================================
  // 기록
  // ============================================================

  const STATUS_FILTERS = ['전체', '승인 대기', '승인 완료', '수정 요청', '완료', '오류', '폐기'];
  const EXTRA_FILTERS = [
    { key: 'model', value: 'GPT', label: 'GPT' },
    { key: 'model', value: '클로드', label: 'Claude' },
    { key: 'type', value: 'AI 협의', label: 'AI 협의' },
    { key: 'type', value: '개발', label: '개발' }
  ];

  function initHistoryFilters() {
    const statusRow = document.getElementById('history-status-filters');
    statusRow.innerHTML = STATUS_FILTERS.map(function (label) {
      const active = (label === '전체' && !state.history.status) || label === state.history.status;
      return '<button class="chip' + (active ? ' active' : '') + '" data-status="' + escapeHtml(label) + '">' + escapeHtml(label) + '</button>';
    }).join('');

    statusRow.addEventListener('click', function (e) {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      const val = chip.getAttribute('data-status');
      state.history.status = val === '전체' ? '' : val;
      statusRow.querySelectorAll('.chip').forEach(function (c) { c.classList.toggle('active', c === chip); });
      loadHistory();
    });

    const extraRow = document.getElementById('history-extra-filters');
    extraRow.innerHTML = '<button class="chip active" data-key="" data-value="">전체</button>' +
      EXTRA_FILTERS.map(function (f) {
        return '<button class="chip" data-key="' + escapeHtml(f.key) + '" data-value="' + escapeHtml(f.value) + '">' + escapeHtml(f.label) + '</button>';
      }).join('');

    extraRow.addEventListener('click', function (e) {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      extraRow.querySelectorAll('.chip').forEach(function (c) { c.classList.toggle('active', c === chip); });
      state.history.model = '';
      state.history.type = '';
      const key = chip.getAttribute('data-key');
      const value = chip.getAttribute('data-value');
      if (key === 'model') state.history.model = value;
      if (key === 'type') state.history.type = value;
      loadHistory();
    });

    const search = document.getElementById('history-search');
    search.addEventListener('input', debounce(function () {
      state.history.search = search.value.trim();
      loadHistory();
    }, 350));
  }

  function historyCardHtml(card) {

  function loadHistory() {
    const listEl = document.getElementById('history-list');
    setLoading(listEl, 4);

      status: state.history.status,
      type: state.history.type,
      model: state.history.model,
      search: state.history.search

      if (!res || !res.success) {
        setErrorState(listEl, '작업 기록을 불러오지 못했습니다.', function () { loadHistory(); });

      const rows = res.data || [];
      if (!rows.length) {
        setEmpty(listEl, '등록된 작업이 없습니다', '조건에 맞는 작업이 없습니다. 필터를 변경해보세요.');

      listEl.innerHTML = rows.map(historyCardHtml).join('');

  function loadSettings() {
    const el = document.getElementById('settings-content');
    setLoading(el, 3);

    Promise.all([callServer('getProjectStatus'), callServer('getAppConfigForClient')]).then(function (results) {
      const projectRes = results[0];
      const configRes = results[1];

      if ((!projectRes || !projectRes.success) && (!configRes || !configRes.success)) {
        setErrorState(el, '설정 정보를 불러오지 못했습니다.', function () { loadSettings(); });
        return;
      }

      let html = '';

      html += '<div class="settings-group">';
      if (projectRes && projectRes.success) {
        const p = projectRes.data;
        html += settingsRow('현재 프로젝트', escapeHtml(p.projectName || p.projectId || '-'));
        html += settingsRow('진행 단계', escapeHtml(p.currentStage || '-'));
      } else {
        html += settingsRow('현재 프로젝트', '불러오지 못함');
      }
      html += '</div>';

      html += '<div class="settings-group">';
      if (configRes && configRes.success) {
        const c = configRes.data;
        html += settingsRow('GPT 모델명', escapeHtml(c.openaiModel));
        html += settingsRow('Claude 기본 모델명', escapeHtml(c.claudeModel));
        html += settingsRow('Claude 폴백 모델명', escapeHtml(c.claudeFallbackModel));
        html += settingsRow('자동 실행', c.autoRunEnabled ? '활성화' : '비활성화');
        html += settingsRow('자동 실행 주기', escapeHtml(c.autoRunInterval || '-'));
        html += settingsRow('최근 성공 실행', escapeHtml(c.lastSuccessAt || '기록 없음'));
        html += settingsRow('최근 오류 발생', escapeHtml(c.lastErrorAt || '기록 없음'));
      } else {
        html += settingsRow('자동화 설정', '불러오지 못함');
      }
      html += '</div>';

      html += '<div class="settings-group">';
      if (configRes && configRes.success) {

        html += settingsRow('Anthropic API', keyBadge(configRes.data.anthropicKeyConfigured));

  function initPipelineForm() {
    const form = document.getElementById('pipeline-new-form');
    const submitBtn = document.getElementById('pipeline-new-submit');
    const originalText = submitBtn.textContent;

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const businessName = document.getElementById('pipeline-field-name').value.trim();
      const businessContent = document.getElementById('pipeline-field-content').value.trim();
      if (!businessName) { toast('사업명을 입력해주세요.', true); return; }
      if (!businessContent) { toast('사업내용을 입력해주세요.', true); return; }

      submitBtn.disabled = true;
      submitBtn.textContent = 'AI 협의 진행 중... (1~2분 소요)';

      callServer('createBusinessProject', { businessName: businessName, businessContent: businessContent })
        .then(function (res) {
          submitBtn.disabled = false;
          submitBtn.textContent = originalText;

          if (!res || !res.success) {
            toast((res && res.message) || '사업 등록 중 오류가 발생했습니다.', true);
            return;
          }

          toast('사업 등록과 AI 협의가 끝났습니다. 최종보고서를 확인해주세요.');
          form.reset();
          openPipelineDetail(res.data.projectId);
        });
    });
  }

  // 승인 대기 단계 이름 -> 처리할 서버 함수 이름.
  const PIPELINE_GATE_FN = {
    '최종보고서': 'approveFinalReport',
    '개발명세': 'approveDevelopmentSpec',
    '개발완료결과': 'approveDevelopmentResult'
  };

  function runPipelineApprovalAction(projectId, gateLabel, decisionKey, note, triggerBtn) {
    const fnName = PIPELINE_GATE_FN[gateLabel];
    if (!fnName) {
      toast('처리할 수 없는 승인 단계입니다.', true);
      return Promise.resolve(null);
    }
    const originalText = triggerBtn ? triggerBtn.textContent : '';
    const busyText = {
      approve: gateLabel === '개발명세' ? '실제개발·테스트·배포 진행 중... (수 분 소요)' : '승인 처리 중...',
      revise: '수정 요청 처리 중...',
      reject: '폐기 처리 중...'
    };
    if (triggerBtn) {
      triggerBtn.disabled = true;
      triggerBtn.textContent = busyText[decisionKey] || '처리 중...';
    }
    return callServer(fnName, projectId, decisionKey, note || '').then(function (res) {
      if (triggerBtn) {
        triggerBtn.disabled = false;
        triggerBtn.textContent = originalText;
      }
      if (!res || !res.success) {
        toast((res && res.message) || '처리 중 오류가 발생했습니다.', true);
        return null;
      }
      toast('처리되었습니다.');
      return res;
    });
  }

        html += '<div class="detail-body">' + (formatResultText(d.pendingGate.summary) || '<p>내용 없음</p>') + '</div>';
        html += '</div>';
        html += '<div class="detail-block card-revise-box hidden" data-pipeline-revise-box="' + escapeHtml(d.projectId) + '">';

        html += '<div class="detail-section-title">수정의견</div>';
        html += '<textarea class="input textarea" rows="4" placeholder="어떤 부분을 수정할지 적어주세요."></textarea>';
        html += '<button class="btn btn-primary btn-block pl-act-revise-submit" data-project-id="' + escapeHtml(d.projectId) + '" data-gate="' + escapeHtml(d.pendingGate.gateLabel) + '">수정 요청 보내기</button>';

      }

      const links = d.links || {};
      const linksHtml =
        pipelineLinkRow('최종보고서', links.finalReportUrl) +
        pipelineLinkRow('개발명세', links.devSpecUrl) +
        pipelineLinkRow('개발결과물(소스코드)', links.outputUrl) +
        pipelineLinkRow('테스트보고서', links.testReportUrl) +
        pipelineLinkRow('테스트 웹앱', links.testAppUrl) +
        pipelineLinkRow('소스 프로젝트', links.sourceProjectUrl) +
        pipelineLinkRow('정식배포', links.prodUrl);
      if (linksHtml) {
        html += '<div class="detail-block"><div class="detail-section-title">결과물 링크</div><div class="settings-group">' + linksHtml + '</div></div>';
      }

      if (d.errorText) {
        html += '<div class="detail-block">';
        html += '<div class="detail-section-title">오류내용</div>';
        html += '<div class="detail-error-box">' + escapeHtml(d.errorText) + '</div>';
        html += '</div>';
      }

      if (d.logs && d.logs.length) {
        html += '<div class="detail-block"><div class="detail-section-title">진행 기록</div><div class="discussion-log">';
        html += d.logs.slice().reverse().map(function (l) {
          return '<div class="discussion-step">' +
            '<div class="detail-section-title">' + escapeHtml(l.stage) + ' · ' + escapeHtml(l.actor) + ' (' + escapeHtml(l.status) + ')</div>' +
            '<div class="detail-body"><p>' + escapeHtml(l.work) + '</p></div>' +
            '<div class="card-meta">' + escapeHtml(l.at) + '</div>' +
            (l.errorText ? '<div class="detail-error-box">' + escapeHtml(l.errorText) + '</div>' : '') +
            '</div>';
        }).join('');
        html += '</div></div>';
      }

      el.innerHTML = html;
      renderPipelineActionBar(d);
    });
  }

  document.addEventListener('click', function (e) {
    const pipelineCard = e.target.closest('.pipeline-card');
    if (pipelineCard) {
      openPipelineDetail(pipelineCard.getAttribute('data-project-id'));
      return;
    }

    const approveBtn = e.target.closest('.pl-act-approve');
    if (approveBtn) {
      const projectId = approveBtn.getAttribute('data-project-id');
      const gate = approveBtn.getAttribute('data-gate');
      runPipelineApprovalAction(projectId, gate, 'approve', '', approveBtn).then(function (res) {
        if (res) loadPipelineDetail(projectId);
      });
      return;
    }

    const rejectBtn = e.target.closest('.pl-act-reject');
    if (rejectBtn) {
      const projectId = rejectBtn.getAttribute('data-project-id');
      const gate = rejectBtn.getAttribute('data-gate');
      runPipelineApprovalAction(projectId, gate, 'reject', '', rejectBtn).then(function (res) {
        if (res) loadPipelineDetail(projectId);
      });
      return;
    }

    const reviseToggle = e.target.closest('.pl-act-revise-toggle');
    if (reviseToggle) {
      const projectId = reviseToggle.getAttribute('data-project-id');
      const box = document.querySelector('[data-pipeline-revise-box="' + CSS.escape(projectId) + '"]');
      if (box) box.classList.toggle('hidden');
      return;
    }

    const reviseSubmit = e.target.closest('.pl-act-revise-submit');
    if (reviseSubmit) {
      const projectId = reviseSubmit.getAttribute('data-project-id');
      const gate = reviseSubmit.getAttribute('data-gate');
      const box = document.querySelector('[data-pipeline-revise-box="' + CSS.escape(projectId) + '"]');
      const textarea = box ? box.querySelector('textarea') : null;
      const note = textarea ? textarea.value.trim() : '';
      if (!note) { toast('수정의견을 입력해주세요.', true); return; }
      runPipelineApprovalAction(projectId, gate, 'revise', note, reviseSubmit).then(function (res) {
        if (res) loadPipelineDetail(projectId);
      });
      return;
    }
  });

  const pipelineDetailBackBtn = document.getElementById('pipeline-detail-back');
  if (pipelineDetailBackBtn) {
    pipelineDetailBackBtn.addEventListener('click', function () {
      navTo('pipeline');
    });
  }


  // ============================================================
  // 워드프레스 블로그 (애드센스 승인 자동화)
  // ============================================================

  const blogState = {
    tab: 'setup',
    detailId: null,
    keywordsLoaded: false,
    contentsLoaded: false,
    configLoaded: false,
    openInterview: null // 경험 질문 칸을 펼쳐 둔 키워드번호
  };

  const BLOG_STATUS_TONE = {
    '원고 완료': 'st-neutral',
    '초안 저장': 'st-neutral',
    '예약 완료': 'st-pending',
    '발행 완료': 'st-approved',
    '오류': 'st-error'
  };

  function blogStatusBadgeHtml(status) {
    const tone = BLOG_STATUS_TONE[status] || 'st-neutral';
    return '<span class="status-badge ' + tone + '">' + escapeHtml(status || '-') + '</span>';
  }

  function blogSwitchTab(tab) {
    blogState.tab = tab;
    document.querySelectorAll('[data-blog-tab]').forEach(function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-blog-tab') === tab);
    });
    ['setup', 'keyword', 'content', 'config'].forEach(function (name) {
      const panel = document.getElementById('blog-panel-' + name);
      if (panel) panel.classList.toggle('hidden', name !== tab);
    });

    if (tab === 'keyword' && !blogState.keywordsLoaded) loadBlogKeywords();
    if (tab === 'content') loadBlogContents();
    if (tab === 'config' && !blogState.configLoaded) loadBlogConfig();
  }

  function loadBlogView() {
    blogSwitchTab(blogState.tab);
    if (blogState.tab === 'setup') loadBlogConfig();
  }

  // ---------- ① 블로그 준비 ----------

  function renderReadiness(data) {
    const el = document.getElementById('blog-readiness');
    const toneClass = data.score >= 90 ? 'st-approved' : (data.score >= 70 ? 'st-pending' : 'st-error');

    let html = '<div class="detail-block">';
    html += '<div class="detail-section-title">' + escapeHtml(data.verdict) + ' · ' + data.score + '점 (' + data.passed + '/' + data.total + ')</div>';
    html += '<div class="card-meta">발행 ' + data.stats.posts + '편 · 평균 ' + data.stats.avgLength + '자 · 대표이미지 ' +
      data.stats.withImage + '편 · 최근 30일 ' + data.stats.recent30d + '편</div>';
    html += '<div class="settings-group" style="margin-top:12px;">';
    data.checks.forEach(function (c) {
      html += '<div class="settings-row">' +
        '<span class="label">' + escapeHtml(c.key) + '</span>' +
        '<span class="value"><span class="status-badge ' + (c.pass ? 'st-approved' : toneClass) + '">' +
        (c.pass ? '✅ ' : '⚠️ ') + escapeHtml(c.detail) + '</span></span>' +
        '</div>';
    });
    html += '</div>';

    const failed = data.checks.filter(function (c) { return !c.pass; });
    if (failed.length) {
      html += '<div class="detail-section-title" style="margin-top:16px;">보완할 점</div><ul>';
      failed.forEach(function (c) {
        html += '<li><strong>' + escapeHtml(c.key) + '</strong> — ' + escapeHtml(c.fix) + '</li>';
      });
      html += '</ul>';
    }
    html += '</div>';
    el.innerHTML = html;
  }

  function runBlogReadinessCheck() {
    const el = document.getElementById('blog-readiness');
    const btn = document.getElementById('blog-check-btn');
    setLoading(el, 1);
    btn.disabled = true;
    btn.textContent = '점검 중...';

    callServer('wpCheckAdsenseReadiness').then(function (res) {
      btn.disabled = false;
      btn.textContent = '지금 점검하기';
      if (!res || !res.success) {
        setEmpty(el, '점검하지 못했습니다', (res && res.message) || '워드프레스 연결을 먼저 확인해주세요.');
        return;
      }
      renderReadiness(res.data);
    });
  }

  function initBlogSetupForm() {
    const form = document.getElementById('blog-setup-form');
    const btn = document.getElementById('blog-setup-submit');
    const resultEl = document.getElementById('blog-setup-result');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const payload = {
        siteTitle: document.getElementById('blog-field-site-title').value.trim(),
        tagline: document.getElementById('blog-field-tagline').value.trim(),
        topic: document.getElementById('blog-field-topic').value.trim(),
        target: document.getElementById('blog-field-target').value.trim(),
        authorIntro: document.getElementById('blog-field-author').value.trim(),
        ownerEmail: document.getElementById('blog-field-email').value.trim(),
        categories: document.getElementById('blog-field-categories').value
          .split(',').map(function (s) { return s.trim(); }).filter(Boolean)
      };

      btn.disabled = true;
      btn.textContent = '블로그를 꾸미는 중... (1분 내외)';
      resultEl.innerHTML = '';

      callServer('wpApplyBlogSetup', payload).then(function (res) {
        btn.disabled = false;
        btn.textContent = '블로그 꾸미기 실행';
        if (!res || !res.success) {
          toast((res && res.message) || '블로그 구성 중 오류가 발생했습니다.', true);
          return;
        }
        let html = '<div class="detail-block"><div class="detail-section-title">처리 결과</div><ul>';
        (res.data.done || []).forEach(function (d) { html += '<li>' + escapeHtml(d) + '</li>'; });
        html += '</ul>';
        if ((res.data.warnings || []).length) {
          html += '<div class="detail-section-title">직접 확인이 필요한 부분</div><ul>';
          res.data.warnings.forEach(function (w) { html += '<li>' + escapeHtml(w) + '</li>'; });
          html += '</ul>';
        }
        html += '</div>';
        resultEl.innerHTML = html;
        toast('블로그 기본 구성을 마쳤습니다.');
        runBlogReadinessCheck();
      });
    });
  }

      '<div class="card">' +
      '<div class="card-top">' +
      '<span class="role-badge">' + escapeHtml(k.keyword) + '</span>' +
      '<span class="status-badge st-neutral">기회 ' + k.score + '점 · 난이도 ' + escapeHtml(k.difficulty || '-') + '</span>' +
      '</div>' +
      '<div class="card-request">' + escapeHtml(k.title || '') + '</div>' +

  function loadBlogKeywords() {
    const el = document.getElementById('blog-keyword-list');
    setLoading(el, 3);
    callServer('wpListKeywords', {}).then(function (res) {
      blogState.keywordsLoaded = true;
      if (!res || !res.success) {
        setErrorState(el, (res && res.message) || '키워드를 불러오지 못했습니다.', loadBlogKeywords);
        return;
      }
      const items = res.data || [];
      if (!items.length) {
        setEmpty(el, '아직 발굴한 키워드가 없습니다', '위에서 씨앗 키워드를 넣고 “키워드 찾기”를 눌러보세요.');
        return;
      }
      el.innerHTML = items.map(blogKeywordCardHtml).join('');
      if (blogState.openInterview) openInterviewBox(blogState.openInterview);
    });
  }

  function initBlogKeywordForm() {
    const form = document.getElementById('blog-keyword-form');
    const btn = document.getElementById('blog-keyword-submit');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const seed = document.getElementById('blog-field-seed').value.trim();
      btn.disabled = true;
      btn.textContent = '검색어를 모으는 중... (30초 내외)';

      callServer('wpDiscoverKeywords', { seed: seed }).then(function (res) {
        btn.disabled = false;
        btn.textContent = '키워드 찾기';
        if (!res || !res.success) {
          toast((res && res.message) || '키워드 발굴에 실패했습니다.', true);
          return;
        }
        toast(res.message);
        loadBlogKeywords();
      });
    });
  }

  function renderInterviewBox(keywordId, notes) {
    const box = document.querySelector('[data-interview-box="' + CSS.escape(keywordId) + '"]');
    if (!box) return;
    box.classList.remove('hidden');

    if (!notes.length) {
      box.innerHTML = '<div class="state-box"><div class="state-desc">아직 질문이 없습니다.</div>' +
        '<button class="btn btn-outline blog-interview-make" data-keyword-id="' + escapeHtml(keywordId) + '">경험 질문 만들기</button></div>';
      return;
    }

    let html = '<div class="revise-panel">';
    html += '<div class="detail-section-title">답할 수 있는 것만 채워주세요</div>';
    html += '<p class="field-hint">여기 적은 내용만 글에서 1인칭 경험으로 쓰입니다. 비워두면 경험담을 지어내지 않습니다.</p>';
    notes.forEach(function (n) {
      html += '<label class="field">' +
        '<span class="field-label">' + escapeHtml(n.question) + '</span>' +
        '<textarea class="input textarea" rows="3" data-note-id="' + escapeHtml(n.noteId) + '" ' +
        'placeholder="숫자, 실패한 점, 예상과 달랐던 점을 그대로 적어주세요.">' + escapeHtml(n.answer) + '</textarea>' +
        '</label>';
    });
    html += '<button class="btn btn-primary btn-block blog-interview-save" data-keyword-id="' + escapeHtml(keywordId) + '">경험 저장</button>';
    html += '<button class="btn btn-outline btn-block blog-interview-make" data-keyword-id="' + escapeHtml(keywordId) + '">질문 더 만들기</button>';
    html += '</div>';
    box.innerHTML = html;
  }

  function openInterviewBox(keywordId) {
    const box = document.querySelector('[data-interview-box="' + CSS.escape(keywordId) + '"]');
    if (!box) return;
    blogState.openInterview = keywordId;
    box.classList.remove('hidden');
    box.innerHTML = '<div class="skeleton skeleton-card"></div>';

    callServer('wpGetExperienceNotes', keywordId).then(function (res) {
      if (!res || !res.success) {
        box.innerHTML = '<div class="state-box"><div class="state-desc">' +
          escapeHtml((res && res.message) || '경험 기록을 불러오지 못했습니다.') + '</div></div>';
        return;
      }
      renderInterviewBox(keywordId, res.data || []);
    });
  }

  function loadBlogContents() {
    const summaryEl = document.getElementById('blog-summary');
    const listEl = document.getElementById('blog-content-list');
    setLoading(summaryEl, 1);
    setLoading(listEl, 3);

    callServer('wpGetDashboard').then(function (res) {
      blogState.contentsLoaded = true;
      if (!res || !res.success) {
        setErrorState(summaryEl, (res && res.message) || '불러오지 못했습니다.', loadBlogContents);
        listEl.innerHTML = '';
        return;
      }
      const s = res.data.summary;
      summaryEl.innerHTML =
        summaryCardHtml('대기 키워드', s.keywordsPending, '') +
        summaryCardHtml('초안', s.drafts, 'processing') +
        summaryCardHtml('예약', s.scheduled, 'pending') +
        summaryCardHtml('발행', s.published, '');

      const items = res.data.contents || [];
      if (!items.length) {
        setEmpty(listEl, '아직 작성한 글이 없습니다', '“키워드·경험” 탭에서 키워드를 고르고 원고를 만들어보세요.');
        return;
      }
      listEl.innerHTML = items.map(blogContentCardHtml).join('');

  function openBlogDetail(contentId) {
    blogState.detailId = contentId;
    state.view = 'blog-detail';
    document.querySelectorAll('.view').forEach(function (el) { el.classList.remove('active'); });
    document.getElementById('view-blog-detail').classList.add('active');

      html += '<label class="field"><span class="field-label">요약 (검색 결과에 보이는 문구)</span>' +
        '<textarea class="input textarea" id="blog-edit-excerpt" rows="2">' + escapeHtml(d.excerpt) + '</textarea></label>';

      if (!d.link) {
        html += '<div class="detail-block"><div class="detail-section-title">예약 발행</div>';
        html += '<label class="field"><span class="field-label">발행 일시 (예: 2026-08-20 09:00)</span>' +
          '<input type="text" class="input" id="blog-edit-schedule" placeholder="2026-08-20 09:00"></label>';
        html += '<button class="btn btn-primary btn-block blog-act-publish" data-content-id="' + escapeHtml(d.contentId) +
          '" data-mode="예약발행">이 시각에 발행 예약</button>';
        html += '<p class="field-hint">발행할 때 설정한 수만큼 이미지를 만들어 대표 이미지와 본문에 자동으로 붙입니다.</p>';
        html += '</div>';
      } else if (d.status === '예약 완료') {
        html += '<div class="detail-block"><div class="detail-section-title">예약 변경</div>';
        html += '<label class="field"><span class="field-label">새 발행 일시</span>' +
          '<input type="text" class="input" id="blog-edit-schedule" placeholder="2026-08-20 09:00"></label>';
        html += '<button class="btn btn-outline btn-block blog-act-reschedule" data-content-id="' + escapeHtml(d.contentId) + '">예약 시각 변경</button>';
        html += '</div>';
      }

      if (d.review) {
        html += '<div class="detail-block"><div class="detail-section-title">애드센스 관점 검수</div>' +
          '<div class="detail-body">' + (formatResultText(d.review) || '') + '</div></div>';
      }
      if (d.errorText) {
        html += '<div class="detail-block"><div class="detail-section-title">오류</div>' +
          '<div class="detail-error-box">' + escapeHtml(d.errorText) + '</div></div>';
      }

      el.innerHTML = html;
      renderBlogActionBar(d);
    });
  }

  function collectBlogEdits(contentId) {
    const get = function (id) {
      const el = document.getElementById(id);
      return el ? el.value : undefined;
    };
    return {
      contentId: contentId,
      title: get('blog-edit-title'),
      excerpt: get('blog-edit-excerpt'),
      tags: get('blog-edit-tags'),
      category: get('blog-edit-category'),
      contentHtml: get('blog-edit-content')
    };
  }

  // ---------- ④ 설정·자동화 ----------

  function loadBlogConfig() {
    callServer('wpGetSettingsForClient').then(function (res) {
      blogState.configLoaded = true;
      const statusEl = document.getElementById('blog-connection-status');
      if (!res || !res.success) {
        statusEl.innerHTML = '<div class="state-box"><div class="state-desc">' +
          escapeHtml((res && res.message) || '설정을 불러오지 못했습니다.') + '</div></div>';
        return;
      }
      const d = res.data;
      const s = d.settings || {};

      statusEl.innerHTML =
        '<div class="settings-group">' +
        settingsRow('워드프레스 연결', d.connected ? keyBadge(true) : keyBadge(false)) +
        settingsRow('사이트 주소', escapeHtml(d.siteUrl || '미설정')) +
        settingsRow('아이디', escapeHtml(d.userName || '미설정')) +
        settingsRow('OpenAI 키', keyBadge(d.hasOpenAiKey)) +
        settingsRow('Anthropic 키', keyBadge(d.hasAnthropicKey)) +
        settingsRow('관리대장', '<a class="value" href="' + escapeHtml(d.ledgerUrl) + '" target="_blank" rel="noopener">열기 ↗</a>') +
        (d.lastCheck ? settingsRow('최근 점검', escapeHtml(d.lastCheck.score + '점 · ' + d.lastCheck.verdict + ' (' + d.lastCheck.at + ')')) : '') +
        '</div>';

      document.getElementById('blog-field-site-url').value = d.siteUrl || '';
      document.getElementById('blog-field-username').value = d.userName || '';

      document.getElementById('blog-cfg-tone').value = s['어투'] || '';
      document.getElementById('blog-cfg-length').value = s['글자수목표'] || '2000';
      document.getElementById('blog-cfg-images').value = s['편당이미지수'] || '2';
      document.getElementById('blog-cfg-fallback').value = s['경험없을때'] || '정보중심';
      document.getElementById('blog-cfg-image-on').checked = (s['이미지생성사용'] || 'Y') === 'Y';
      document.getElementById('blog-cfg-review-on').checked = (s['자동검수사용'] || 'Y') === 'Y';

      document.getElementById('blog-auto-mode').value = s['자동발행모드'] || '예약발행';
      document.getElementById('blog-auto-slots').value = s['예약발행시각'] || '09:00';
      document.getElementById('blog-auto-perday').value = s['하루발행수'] || '1';

      document.getElementById('blog-auto-state').innerHTML =
        settingsRow('자동 발행', d.autoOn
          ? '<span class="status-badge st-approved">켜짐 ' + escapeHtml(s['자동실행주기'] || '') + '</span>'
          : '<span class="status-badge st-neutral">꺼짐</span>');

      // 준비 탭 폼에도 저장된 값을 채워 둔다.
      if (!document.getElementById('blog-field-topic').value) {
        document.getElementById('blog-field-topic').value = s['블로그주제'] || '';
        document.getElementById('blog-field-target').value = s['타깃독자'] || '';
        document.getElementById('blog-field-author').value = s['글쓴이소개'] || '';
        document.getElementById('blog-field-email').value = s['운영자이메일'] || '';
      }

      loadBlogLogs();
    });
  }

  function loadBlogLogs() {
    const el = document.getElementById('blog-log-list');
    callServer('wpGetRecentLogs', 20).then(function (res) {
      if (!res || !res.success || !(res.data || []).length) {
        setEmpty(el, '아직 기록이 없습니다', '');
        return;
      }
      el.innerHTML = '<div class="discussion-log">' + res.data.map(function (l) {
        return '<div class="discussion-step">' +
          '<div class="detail-section-title">' + escapeHtml(l.stage) + ' · ' + escapeHtml(l.result) + '</div>' +
          '<div class="detail-body"><p>' + escapeHtml(l.work) + (l.target ? ' — ' + escapeHtml(l.target) : '') + '</p></div>' +
          (l.detail ? '<div class="card-meta">' + escapeHtml(l.detail) + '</div>' : '') +
          '<div class="card-meta">' + escapeHtml(l.at) + '</div>' +
          (l.errorText ? '<div class="detail-error-box">' + escapeHtml(l.errorText) + '</div>' : '') +
          '</div>';
      }).join('') + '</div>';
    });
  }

  function initBlogConfigForms() {
    document.getElementById('blog-connect-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const btn = document.getElementById('blog-connect-submit');
      const original = btn.textContent;
      btn.disabled = true;
      btn.textContent = '연결 확인 중...';

      callServer('wpSaveConnection', {
        siteUrl: document.getElementById('blog-field-site-url').value.trim(),
        userName: document.getElementById('blog-field-username').value.trim(),
        appPassword: document.getElementById('blog-field-apppass').value.trim()
      }).then(function (res) {
        btn.disabled = false;
        btn.textContent = original;
        if (!res || !res.success) {
          toast((res && res.message) || '연결에 실패했습니다.', true);
          return;
        }
        document.getElementById('blog-field-apppass').value = '';
        toast(res.message);
        loadBlogConfig();
      });
    });

    document.getElementById('blog-config-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const btn = document.getElementById('blog-config-submit');
      btn.disabled = true;

      callServer('wpSaveSettings', {
        settings: {
          '어투': document.getElementById('blog-cfg-tone').value.trim(),
          '글자수목표': document.getElementById('blog-cfg-length').value,
          '편당이미지수': document.getElementById('blog-cfg-images').value,
          '경험없을때': document.getElementById('blog-cfg-fallback').value,
          '이미지생성사용': document.getElementById('blog-cfg-image-on').checked ? 'Y' : 'N',
          '자동검수사용': document.getElementById('blog-cfg-review-on').checked ? 'Y' : 'N'
        }
      }).then(function (res) {
        btn.disabled = false;
        toast((res && res.message) || '저장에 실패했습니다.', !(res && res.success));
      });
    });

    document.getElementById('blog-auto-on').addEventListener('click', function () {
      const btn = this;
      btn.disabled = true;
      btn.textContent = '설정 중...';

      callServer('wpSaveSettings', {
        settings: {
          '자동발행모드': document.getElementById('blog-auto-mode').value,
          '예약발행시각': document.getElementById('blog-auto-slots').value.trim(),
          '하루발행수': document.getElementById('blog-auto-perday').value
        }
      }).then(function () {
        return callServer('wpInstallAutoPublishTrigger', Number(document.getElementById('blog-auto-hours').value || 6));
      }).then(function (res) {
        btn.disabled = false;
        btn.textContent = '자동 발행 켜기';
        toast((res && res.message) || '자동 발행 설정에 실패했습니다.', !(res && res.success));
        loadBlogConfig();
      });
    });

    document.getElementById('blog-auto-off').addEventListener('click', function () {
      const btn = this;
      btn.disabled = true;
      callServer('wpRemoveAutoPublishTriggers').then(function (res) {
        btn.disabled = false;
        toast((res && res.message) || '해제에 실패했습니다.', !(res && res.success));
        loadBlogConfig();
      });
    });

    document.getElementById('blog-auto-run').addEventListener('click', function () {
      const btn = this;
      const original = btn.textContent;
      btn.disabled = true;
      btn.textContent = '글을 쓰고 이미지를 만드는 중... (2~4분)';

      callServer('wpAutomationCycle').then(function (res) {
        btn.disabled = false;
        btn.textContent = original;
        toast((res && res.message) || '자동 발행에 실패했습니다.', !(res && res.success));
        loadBlogLogs();
      });
    });
  }

  function initBlogTabs() {
    document.getElementById('blog-tabs').addEventListener('click', function (e) {
      const btn = e.target.closest('[data-blog-tab]');
      if (btn) blogSwitchTab(btn.getAttribute('data-blog-tab'));
    });

    document.getElementById('blog-check-btn').addEventListener('click', runBlogReadinessCheck);

    const backBtn = document.getElementById('blog-detail-back');
    if (backBtn) {
      backBtn.addEventListener('click', function () {
        blogState.tab = 'content';
        navTo('blog');
      });
    }
  }

  document.addEventListener('click', function (e) {
    const contentCard = e.target.closest('.blog-content-card');
    if (contentCard) {
      openBlogDetail(contentCard.getAttribute('data-content-id'));
      return;
    }

    const interviewBtn = e.target.closest('.blog-interview-btn');
    if (interviewBtn) {
      const keywordId = interviewBtn.getAttribute('data-keyword-id');
      const box = document.querySelector('[data-interview-box="' + CSS.escape(keywordId) + '"]');
      if (box && !box.classList.contains('hidden')) {
        box.classList.add('hidden');
        blogState.openInterview = null;
        return;
      }
      openInterviewBox(keywordId);
      return;
    }

    const makeBtn = e.target.closest('.blog-interview-make');
    if (makeBtn) {
      const keywordId = makeBtn.getAttribute('data-keyword-id');
      makeBtn.disabled = true;
      makeBtn.textContent = '질문을 만드는 중...';
      callServer('wpCreateExperienceInterview', keywordId).then(function (res) {
        if (!res || !res.success) {
          toast((res && res.message) || '질문 생성에 실패했습니다.', true);
          makeBtn.disabled = false;
          makeBtn.textContent = '경험 질문 만들기';
          return;
        }
        toast(res.message);
        openInterviewBox(keywordId);
      });
      return;
    }

    const saveNotesBtn = e.target.closest('.blog-interview-save');
    if (saveNotesBtn) {
      const keywordId = saveNotesBtn.getAttribute('data-keyword-id');
      const box = document.querySelector('[data-interview-box="' + CSS.escape(keywordId) + '"]');
      const notes = Array.prototype.slice.call(box.querySelectorAll('textarea[data-note-id]')).map(function (t) {
        return { noteId: t.getAttribute('data-note-id'), answer: t.value.trim() };
      });
      saveNotesBtn.disabled = true;
      callServer('wpSaveExperienceNotes', { notes: notes }).then(function (res) {
        saveNotesBtn.disabled = false;
        toast((res && res.message) || '저장에 실패했습니다.', !(res && res.success));
      });
      return;
    }

    const writeBtn = e.target.closest('.blog-write-btn');
    if (writeBtn) {
      const keywordId = writeBtn.getAttribute('data-keyword-id');
      writeBtn.disabled = true;
      writeBtn.textContent = '원고 작성 중... (1~2분)';
      callServer('wpGenerateArticle', { keywordId: keywordId }).then(function (res) {
        writeBtn.disabled = false;
        writeBtn.textContent = '원고 쓰기';
        if (!res || !res.success) {
          toast((res && res.message) || '원고 작성에 실패했습니다.', true);
          return;
        }
        toast(res.message);
        blogState.tab = 'content';
        openBlogDetail(res.data.contentId);
      });
      return;
    }

    const blogSaveBtn = e.target.closest('.blog-act-save');
    if (blogSaveBtn) {
      const contentId = blogSaveBtn.getAttribute('data-content-id');
      blogSaveBtn.disabled = true;
      callServer('wpUpdateContent', collectBlogEdits(contentId)).then(function (res) {
        blogSaveBtn.disabled = false;
        toast((res && res.message) || '저장에 실패했습니다.', !(res && res.success));
      });
      return;
    }

    const blogPublishBtn = e.target.closest('.blog-act-publish');
    if (blogPublishBtn) {
      const contentId = blogPublishBtn.getAttribute('data-content-id');
      const mode = blogPublishBtn.getAttribute('data-mode');
      const scheduleEl = document.getElementById('blog-edit-schedule');
      const scheduleAt = scheduleEl ? scheduleEl.value.trim() : '';
      if (mode === '예약발행' && !scheduleAt) {
        toast('발행 일시를 입력해주세요.', true);
        return;
      }
      const original = blogPublishBtn.textContent;
      blogPublishBtn.disabled = true;
      blogPublishBtn.textContent = '이미지 생성 후 올리는 중... (1~3분)';

      // 화면에서 고친 내용을 먼저 저장한 뒤 발행한다.
      callServer('wpUpdateContent', collectBlogEdits(contentId)).then(function () {
        return callServer('wpPublishContent', contentId, mode, scheduleAt);
      }).then(function (res) {
        blogPublishBtn.disabled = false;
        blogPublishBtn.textContent = original;
        if (!res || !res.success) {
          toast((res && res.message) || '발행에 실패했습니다.', true);
          return;
        }
        toast(res.message);
        loadBlogDetail(contentId);
      });
      return;
    }

    const rescheduleBtn = e.target.closest('.blog-act-reschedule');
    if (rescheduleBtn) {
      const contentId = rescheduleBtn.getAttribute('data-content-id');
      const scheduleEl = document.getElementById('blog-edit-schedule');
      const scheduleAt = scheduleEl ? scheduleEl.value.trim() : '';
      if (!scheduleAt) { toast('새 발행 일시를 입력해주세요.', true); return; }
      rescheduleBtn.disabled = true;
      callServer('wpReschedule', contentId, scheduleAt).then(function (res) {
        rescheduleBtn.disabled = false;
        toast((res && res.message) || '예약 변경에 실패했습니다.', !(res && res.success));
        if (res && res.success) loadBlogDetail(contentId);
      });
      return;
    }
  });

  // ============================================================
  // 초기화
  // ============================================================

  function initNav() {
    document.querySelectorAll('.bottomnav-item, .sidenav-item').forEach(function (btn) {
      btn.addEventListener('click', function () {
        navTo(btn.getAttribute('data-view'));
      });
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    try {
      initNav();
      initNewCommandForm();
      initHistoryFilters();
      initPipelineForm();
      initBlogTabs();
      initBlogSetupForm();
      initBlogKeywordForm();
      initBlogConfigForms();
      navTo('home');
    } catch (err) {
      showFatalError_('초기화', err);
    }
  });
})();
</script>

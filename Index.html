<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include('Styles'); ?>
</head>
<body>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <div id="app" class="app">

    <header class="topbar">
      <div class="topbar-inner">
        <span class="topbar-title">AI 사업 운영</span>
      </div>
    </header>

    <nav class="sidenav" aria-label="주 메뉴">
      <button class="sidenav-item" data-view="home">
        <span class="nav-icon">🏠</span><span>홈</span>
      </button>
      <button class="sidenav-item" data-view="new">
        <span class="nav-icon">➕</span><span>새 작업</span>
      </button>
      <button class="sidenav-item" data-view="history">
        <span class="nav-icon">📋</span><span>기록</span>
      </button>
      <button class="sidenav-item" data-view="settings">
        <span class="nav-icon">⚙️</span><span>설정</span>
      </button>
    </nav>

    <main class="main">

      <!-- 홈 -->
      <section id="view-home" class="view">
        <h1 class="view-title">홈</h1>
        <div id="home-summary" class="summary-grid"></div>
        <h2 class="section-title">지금 확인할 작업</h2>
        <div id="home-pending" class="card-list"></div>
      </section>

      <!-- 새 작업 -->
      <section id="view-new" class="view">
        <h1 class="view-title">새 작업</h1>
        <form id="new-command-form" class="form">
          <label class="field">
            <span class="field-label">작업유형</span>
            <select id="field-type" class="input" required>
              <option value="">선택하세요</option>
              <option value="기획">기획</option>
              <option value="검토">검토</option>
              <option value="개발">개발</option>
              <option value="최종판단">최종판단</option>
              <option value="상태조회">상태조회</option>
            </select>
          </label>
          <p id="field-type-hint" class="field-hint"></p>

          <label class="field">
            <span class="field-label">요청내용</span>
            <textarea id="field-request" class="input textarea" rows="6" placeholder="요청할 내용을 자세히 적어주세요." required></textarea>
          </label>

          <label class="field">
            <span class="field-label">우선순위</span>
            <select id="field-priority" class="input">
              <option value="높음">높음</option>
              <option value="보통" selected>보통</option>
              <option value="낮음">낮음</option>
            </select>
          </label>

          <label class="field field-checkbox">
            <input type="checkbox" id="field-approval" checked>
            <span>AI 결과에 대한 승인 절차 필요</span>
          </label>

          <button type="submit" id="new-command-submit" class="btn btn-primary btn-block">작업 등록</button>
        </form>
      </section>

      <!-- 기록 -->
      <section id="view-history" class="view">
        <h1 class="view-title">기록</h1>
        <div class="search-box">
          <input type="search" id="history-search" class="input" placeholder="작업번호, 요청내용, 결과내용 검색">
        </div>
        <div id="history-status-filters" class="chip-row"></div>
        <div id="history-extra-filters" class="chip-row"></div>
        <div id="history-list" class="card-list"></div>
      </section>

      <!-- 설정 -->
      <section id="view-settings" class="view">
        <h1 class="view-title">설정</h1>
        <div id="settings-content"></div>
      </section>

      <!-- 작업 상세 -->
      <section id="view-detail" class="view">
        <div class="detail-header">
          <button id="detail-back" class="btn-icon" aria-label="뒤로">←</button>
          <h1 class="view-title">작업 상세</h1>
        </div>
        <div id="detail-content"></div>
      </section>

    </main>

    <nav class="bottomnav" aria-label="주 메뉴">
      <button class="bottomnav-item" data-view="home">
        <span class="nav-icon">🏠</span><span>홈</span>
      </button>
      <button class="bottomnav-item" data-view="new">
        <span class="nav-icon">➕</span><span>새 작업</span>
      </button>
      <button class="bottomnav-item" data-view="history">
        <span class="nav-icon">📋</span><span>기록</span>
      </button>
      <button class="bottomnav-item" data-view="settings">
        <span class="nav-icon">⚙️</span><span>설정</span>
      </button>
    </nav>

    <div id="detail-actionbar" class="detail-actionbar hidden"></div>

  </div>

  <?!= include('Scripts'); ?>
</body>
</html>
